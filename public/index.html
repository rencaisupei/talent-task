<!doctype html>
<!--
  Web HTML template (used by `expo export -p web` and the dev server because
  web.output is 'single' — app/+html.tsx only applies to 'static' output).

  The web deployment serves both sides: the root path is the consumer app (task
  wall) and /admin is the operator platform. Because the export is a single page,
  this file's title and meta apply to every route; app/admin/_layout.tsx swaps
  the title and the robots meta at runtime while an admin route is open.
  The lang attribute is pinned to Taiwanese Traditional Chinese (zh-Hant-TW) —
  the app ships one language only, so it must not follow the browser locale.
-->
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="content-language" content="zh-Hant-TW" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <!-- 後端連線設定：同步載入且刻意不加 defer，必須在 App bundle 之前執行。
         部署後改 dist/bilt-config.js 就能換連線設定，不必重新建置。 -->
    <script src="/bilt-config.js"></script>

    <title>人才速配 Talent Match｜全台急件即時媒合</title>
    <meta
      name="description"
      content="人才速配（Talent Match）是全台急件媒合服務：30 秒發布需求，附近的專家立即投標，雙向評價與信任度讓你放心成交。"
    />

    <!-- Consumer site is indexable. /admin is excluded by robots.txt, the
         X-Robots-Tag header in public/_headers, and a runtime robots meta. -->
    <meta name="robots" content="index, follow" />

    <!-- Social preview. og:image must be an absolute URL, so it is pinned to the
         production domain (talent-core-pro.com). Changing the deployed hostname
         means updating both absolute URLs below, deploy/nginx.conf and README
         section 3 — nothing derives them at runtime.
         og:url and <link rel="canonical"> are deliberately absent: this is a
         single-page export, so every route returns this same document. A fixed
         value would make a shared /gig/<id> link resolve to the home page (and
         tell crawlers every route duplicates it). They belong to a per-page
         'static' export — see README section 8. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="人才速配 Talent Match" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:title" content="人才速配 Talent Match｜全台急件即時媒合" />
    <meta
      property="og:description"
      content="30 秒發布需求，附近的專家立即投標。雙向評價與信任度讓你放心成交。"
    />
    <meta property="og:image" content="https://talent-core-pro.com/icons/talentmatch-icon.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="人才速配 Talent Match 標誌" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="人才速配 Talent Match｜全台急件即時媒合" />
    <meta
      name="twitter:description"
      content="30 秒發布需求，附近的專家立即投標。雙向評價與信任度讓你放心成交。"
    />
    <meta name="twitter:image" content="https://talent-core-pro.com/icons/talentmatch-icon.png" />

    <!-- Web app manifest — the install contract for Android/Chrome -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />

    <!-- iOS home-screen support. -->
    <link rel="icon" type="image/png" href="/icons/talentmatch-icon.png" />
    <link rel="apple-touch-icon" href="/icons/talentmatch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="人才速配" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- App 內的品牌標誌（lib/brandAssets.web.ts 指向同一個 URL）。這是 192px 的
         UI 專用版，不是上面 favicon 的 1024px 原始檔：20 KB、解碼成本極低，所以能在
         這裡以高優先預先下載，畫面第一次繪製時標誌已在快取，不會出現「文字都好了、
         標誌晚一步才跳出來」。改路徑時兩處要一起改，preload 才會命中。
         檔案由 scripts/generate-brand-assets.mjs 產生（npm run assets:brand）。 -->
    <link rel="preload" as="image" href="/icons/talentmatch-mark-192.png" fetchpriority="high" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
