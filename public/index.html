<!doctype html>
<!--
  Web HTML template (used by `expo export -p web` and the dev server because
  web.output is 'single' — app/+html.tsx only applies to 'static' output).

  The web deployment serves both sides: the root path is the consumer app (task
  wall) and /admin is the operator platform. Because the export is a single page,
  this file's title and meta apply to every route; app/admin/_layout.tsx swaps
  the title and the robots meta at runtime while an admin route is open.
  The lang attribute below is substituted at build time.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>即時發 InstantGig｜全台急件即時媒合</title>
    <meta
      name="description"
      content="即時發（InstantGig）是全台急件媒合服務：30 秒發布需求，附近的專家立即投標，雙向評價與信任度讓你放心成交。"
    />

    <!-- Consumer site is indexable. /admin is excluded by robots.txt, the
         X-Robots-Tag header in public/_headers, and a runtime robots meta. -->
    <meta name="robots" content="index, follow" />

    <!-- Social preview. og:image must be an absolute URL, so it is pinned to the
         production domain (instantgig.tw).
         og:url and <link rel="canonical"> are deliberately absent: this is a
         single-page export, so every route returns this same document. A fixed
         value would make a shared /gig/<id> link resolve to the home page (and
         tell crawlers every route duplicates it). They belong to a per-page
         'static' export — see README section 8. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="即時發 InstantGig" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:title" content="即時發 InstantGig｜全台急件即時媒合" />
    <meta
      property="og:description"
      content="30 秒發布需求，附近的專家立即投標。雙向評價與信任度讓你放心成交。"
    />
    <meta property="og:image" content="https://instantgig.tw/icons/instantgig-icon.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="即時發 InstantGig 標誌" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="即時發 InstantGig｜全台急件即時媒合" />
    <meta
      name="twitter:description"
      content="30 秒發布需求，附近的專家立即投標。雙向評價與信任度讓你放心成交。"
    />
    <meta name="twitter:image" content="https://instantgig.tw/icons/instantgig-icon.png" />

    <!-- Web app manifest — the install contract for Android/Chrome -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />

    <!-- iOS home-screen support. -->
    <link rel="icon" type="image/png" href="/icons/instantgig-icon.png" />
    <link rel="apple-touch-icon" href="/icons/instantgig-icon.png" />
    <meta name="apple-mobile-web-app-title" content="即時發" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
