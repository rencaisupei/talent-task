# Cloudflare Workers (static assets) config for the Expo Web static export.
#
#   npm run build:web            # writes the SPA bundle to dist/
#   npm run deploy:web           # build + deploy as the live version
#   npm run deploy:web:preview   # build + upload a preview version (no live traffic)
#
# This is an assets-only Worker: there is no `main` entry point, Cloudflare just
# serves dist/ from the edge. `not_found_handling` gives the single-page-app
# fallback so deep links such as /admin/login resolve to index.html instead of
# 404. Response headers live in public/_headers (public pages indexable, /admin
# noindex); public/_redirects intentionally holds no rules. Both are copied
# verbatim into dist/ by the export.
#
# `name` must match the Worker created in the Cloudflare dashboard, otherwise a
# local `npm run deploy:web` publishes to a different Worker.
#
# The name is an internal Cloudflare identifier and the workers.dev subdomain —
# it is NOT the public hostname. The site is served from talent-core-pro.com via
# a Custom domain attached to this Worker (README section 3), so renaming this
# would create a second Worker and force the custom domain, Access policy and
# build variables to be set up again. Left as-is deliberately after the domain
# move.

name = "instantgig"
compatibility_date = "2025-11-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
