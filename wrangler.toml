# Cloudflare Workers (static assets) config for the Expo Web static export.
#
#   npm run build:web            # writes the SPA bundle to dist/
#   npm run deploy:web           # build + deploy as the live version
#   npm run deploy:web:preview   # build + upload a preview version (no live traffic)
#
# This is an assets-only Worker: there is no `main` entry point, Cloudflare just
# serves dist/ from the edge. `not_found_handling` gives the single-page-app
# fallback so deep links such as /admin/login resolve to index.html instead of
# 404. Response headers and the / -> /admin redirect live in public/_headers and
# public/_redirects, which the export copies verbatim into dist/.
#
# `name` must match the Worker created in the Cloudflare dashboard, otherwise a
# local `npm run deploy:web` publishes to a different Worker.

name = "instantgig"
compatibility_date = "2025-11-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
