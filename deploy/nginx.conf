# Nginx server block for the Expo Web static export (self-hosted deploy).
#
# The web export serves both sides: the root path is the consumer app (task wall,
# sign-in, publish, bids, chat) and /admin is the operator platform. The consumer
# site may be indexed; /admin must never be indexed or framed.
#
#   npm ci
#   npm run build:web          # writes dist/
#   rsync -a --delete dist/ /var/www/talent-core-pro/
#
# Copy this file to /etc/nginx/sites-available/talent-core-pro, adjust server_name
# and the TLS certificate paths, then symlink it into sites-enabled and reload.
#
# Note on add_header inheritance: a location block with any add_header drops the
# ones declared in the parent, so the shared security headers are repeated in
# every block below.

server {
    listen 80;
    listen [::]:80;
    server_name talent-core-pro.com www.talent-core-pro.com;

    # Force HTTPS — sign-in and admin credentials are posted over this host.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name talent-core-pro.com www.talent-core-pro.com;

    ssl_certificate     /etc/letsencrypt/live/talent-core-pro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talent-core-pro.com/privkey.pem;

    root /var/www/talent-core-pro;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Operator platform: never indexed, never framed. The prefix also covers the
    # legacy /admin-dashboard route. public/robots.txt disallows the same prefix.
    location ^~ /admin {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles and bundled assets never change contents.
    location ^~ /_expo/static/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Entry document and service worker must revalidate on every load.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = /sw.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # SPA fallback: web.output is 'single', so client routes resolve here.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
