# Nginx server block for the Expo Web static export (self-hosted deploy).
#
#   npm ci
#   npm run build:web          # writes dist/
#   rsync -a --delete dist/ /var/www/instantgig/
#
# Copy this file to /etc/nginx/sites-available/instantgig, adjust server_name
# and the TLS certificate paths, then symlink it into sites-enabled and reload.

server {
    listen 80;
    listen [::]:80;
    server_name admin.instantgig.tw;

    # Force HTTPS — admin credentials are posted over this host.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.instantgig.tw;

    ssl_certificate     /etc/letsencrypt/live/admin.instantgig.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.instantgig.tw/privkey.pem;

    root /var/www/instantgig;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # This block serves the admin-only host, so nothing here may be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Whole-host robots policy for the admin domain (public/admin-robots.txt).
    location = /robots.txt {
        try_files /admin-robots.txt =404;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed bundles and bundled assets never change contents.
    location ^~ /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Admin platform stays out of search indexes.
    location ^~ /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri /index.html;
    }

    # Entry document and service worker must revalidate on every load.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # SPA fallback: web.output is 'single', so client routes resolve here.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
