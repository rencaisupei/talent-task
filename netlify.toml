# Netlify deploy config for the Expo Web static export.
# `npm run build:web` writes the SPA bundle to dist/ (web.output = 'single'),
# so every route is served from a single index.html with client-side routing.

[build]
command = "npm run build:web"
publish = "dist"

[build.environment]
NODE_VERSION = "20.19.4"
NPM_FLAGS = "--legacy-peer-deps=false"

# SPA fallback: /admin/login, /gig/123 etc. must resolve to index.html.
# Static files in dist/ still win over this rule.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

# Admin platform stays out of search indexes.
[[headers]]
for = "/admin"
[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/admin/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"

# Hashed bundles are safe to cache forever.
[[headers]]
for = "/_expo/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# The entry document and service worker must always revalidate.
[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
